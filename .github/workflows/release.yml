name: release

# On a version tag: build the standalone program for Windows, macOS and Linux and attach the zips to a
# GitHub release (a draft, to check before publishing). mtkclient and Cygwin's e2fsprogs are never
# bundled; they're downloaded at run time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm lck.spec
      - name: Smoke test
        shell: bash
        run: |
          ./dist/lck/lck --version
          ./dist/lck/lck setup --dry-run --workdir "$RUNNER_TEMP/lck-smoke"
          if find dist/lck -iname 'mtk.py' -o -iname 'cygwin1.dll' | grep -q .; then echo "mtkclient and Cygwin must not be bundled"; exit 1; fi
      - name: Zip
        shell: bash
        run: |
          # The docs the tool's messages name go in the zip, next to the program. docs/plans holds test-run
          # notes, not user docs, so it stays out.
          cp README.md CHANGELOG.md LICENSE dist/
          cp -r docs devices assets dist/
          rm -rf dist/docs/plans
          test -f dist/docs/WINDOWS.md && test -f dist/devices/cube/README.md
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../lck-${{ matrix.name }}.zip" lck README.md CHANGELOG.md LICENSE docs devices assets >/dev/null
          else
            zip -qr "../lck-${{ matrix.name }}.zip" lck README.md CHANGELOG.md LICENSE docs devices assets
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lck-${{ matrix.name }}
          path: lck-${{ matrix.name }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          draft: true
