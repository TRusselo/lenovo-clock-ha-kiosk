name: release

# On a version tag: build the standalone program for Windows, macOS and Linux and attach the zips to a
# GitHub release (a draft, to check before publishing). e2fsprogs is bundled (with its licence and source);
# mtkclient, platform-tools and the rest are downloaded at run time, never bundled.
on:
  push:
    tags: ["v*"]
    # Test builds: a push to this branch builds the three zips as run artifacts; nothing is published
    # (the release step only runs for a tag).
    branches: [windows-mac]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
          # Linux: built on Debian 11 (glibc 2.31), for any CPU since 2003. PyInstaller bundles the build
          # system's Python and libraries; on ubuntu-latest they needed glibc 2.38+ and the static debugfs
          # needed AVX2 (issue 1: Debian 12 on an older PC couldn't run v0.1.1).
          - os: ubuntu-latest
            name: linux-x86_64
            container: python:3.12-slim-bullseye
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Build tools (Linux container)
        if: matrix.container
        # Debian 11's security updates were retired in 2026 (404s); the build needs only the release itself. If
        # deb.debian.org drops Debian 11 too, the same release is on archive.debian.org.
        run: |
          sed -i '/security/d' /etc/apt/sources.list
          pkgs="build-essential binutils curl xz-utils zip qemu-user ca-certificates"
          if ! (apt-get update && apt-get install -y --no-install-recommends $pkgs); then
            sed -i 's|deb.debian.org|archive.debian.org|' /etc/apt/sources.list
            apt-get update && apt-get install -y --no-install-recommends $pkgs
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm lck.spec
      # e2fsprogs in the zip, so nobody installs it: built from the pinned upstream source on Linux and macOS,
      # Cygwin's build on Windows. Licences and source addresses go with it.
      - name: Bundle e2fsprogs (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/build-e2fsprogs.sh dist/lck/e2fsprogs
      - name: Bundle e2fsprogs (Windows)
        if: runner.os == 'Windows'
        run: python -c "from lck.e2fs import bundle_windows; bundle_windows('dist/lck/e2fsprogs')"
      - name: Smoke test
        shell: bash
        run: |
          ./dist/lck/lck --version
          ./dist/lck/lck selfcheck
          ./dist/lck/lck setup --dry-run --workdir "$RUNNER_TEMP/lck-smoke"
          if find dist/lck -iname 'mtk.py' | grep -q .; then echo "mtkclient must not be bundled"; exit 1; fi
      - name: Runs on an old PC (Linux)
        if: matrix.container
        shell: bash
        run: |
          # Nehalem (2008): no AVX. The program and the bundled e2fsprogs must run on it.
          qemu-x86_64 -cpu Nehalem ./dist/lck/e2fsprogs/debugfs -V
          qemu-x86_64 -cpu Nehalem ./dist/lck/e2fsprogs/e2fsck -V
          qemu-x86_64 -cpu Nehalem ./dist/lck/lck --version
          qemu-x86_64 -cpu Nehalem ./dist/lck/lck selfcheck
          # And on glibc 2.31 (Debian 11, Ubuntu 20.04): nothing bundled may ask for newer.
          newest=$(find dist/lck -type f \( -name 'lck' -o -name '*.so*' \) -exec objdump -T {} \; 2>/dev/null \
                   | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "newest glibc needed: $newest"
          [ "$(printf '%s\nGLIBC_2.31\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.31" ]
      - name: Zip
        shell: bash
        run: |
          # The docs the tool's messages name go in the zip, next to the program. docs/plans holds test-run
          # notes, not user docs, so it stays out.
          cp README.md CHANGELOG.md LICENSE dist/
          cp -r docs devices assets dist/
          rm -rf dist/docs/plans
          test -f dist/docs/WINDOWS.md && test -f dist/devices/cube/README.md
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../lck-${{ matrix.name }}.zip" lck README.md CHANGELOG.md LICENSE docs devices assets >/dev/null
          else
            zip -qr "../lck-${{ matrix.name }}.zip" lck README.md CHANGELOG.md LICENSE docs devices assets
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lck-${{ matrix.name }}
          path: lck-${{ matrix.name }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: e2fsprogs source (GPL-2.0), for the debugfs and e2fsck in the zips
        run: |
          curl -sSfL -o out/e2fsprogs-1.47.4.tar.xz https://mirrors.edge.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.4/e2fsprogs-1.47.4.tar.xz
          echo "fd5bf388cbdbe006a3d3b318d983b2948382440acc85a87f1e7d108653e8db0b  out/e2fsprogs-1.47.4.tar.xz" | sha256sum -c -
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          draft: true
