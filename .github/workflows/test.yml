name: test

# The tests use fakes: no clock, no network. On all three systems, since the program ships for all three.
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Downloads and runs the real tools: this OS's e2fsprogs (Cygwin's on Windows) editing an ext4 image,
  # and mtkclient starting through uv. No clock needed.
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'macOS'
        run: brew install e2fsprogs libusb
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_live_tools.py
        env:
          LCK_LIVE: "1"
