# Kiosk Clock: what the strategy generates for a typical bedroom clock.
# Paste into a dashboard's raw configuration editor, then replace the entity ids with yours:
#   bedroom_clock_*            -> your clock's Kiosk Satellite entities (Settings > Devices > your clock)
#   media_player.bedroom_clock_player, light.bedside_lamp, light.bedroom_ceiling, weather.home
#   area ids (bedroom, bathroom, ...) and the /bedroom-clock/ paths -> your own
# Easier: use the strategy and "Take control" instead (see README.md).
views:
- title: Home
  path: home
  icon: mdi:clock-outline
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: Home
      heading_style: title
      icon: mdi:clock-outline
      badges:
      - type: button
        icon: mdi:floor-plan
        text: Rooms
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/rooms
      - type: button
        icon: mdi:music
        text: Media
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/media
      - type: button
        icon: mdi:brightness-6
        text: Screen
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/screen
    - type: horizontal-stack
      cards:
      - type: vertical-stack
        cards:
        - type: clock
          clock_size: large
        - type: markdown
          text_only: true
          content: '{{ now().strftime(''%A, %B %-d'') }}


            {% set t = as_datetime(states(''sensor.bedroom_clock_vs_next_timer'')) %}{% if t and t > now() %}⏳ Timer ends {{ (t | as_local).strftime(''%-I:%M
            %p'') }}{% endif %}


            {% set z = as_datetime(states(''sensor.bedroom_clock_alarm_snoozed_until'')) %}{% set a = as_datetime(states(''sensor.bedroom_clock_next_alarm''))
            %}{% if z and z > now() %}💤 Snoozed until {{ (z | as_local).strftime(''%-I:%M %p'') }}{% elif a and a > now() %}⏰ {{ (a | as_local).strftime(''%a
            %-I:%M %p'') }}{% endif %}


            {% set w = states.weather.home %}{% if w %}{{ w.attributes.temperature | round(0) | int }}° {{ w.state | replace(''partlycloudy'',''partly
            cloudy'') | replace(''clear-night'',''clear'') | replace(''-'','' '') }}{% endif %}'
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: light.bedroom_ceiling
            vertical: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: light.bedside_lamp
            vertical: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: tile
            entity: media_player.bedroom_clock_player
            vertical: true
            icon_tap_action:
              action: perform-action
              perform_action: media_player.media_play_pause
              target:
                entity_id: media_player.bedroom_clock_player
            tap_action:
              action: perform-action
              perform_action: media_player.media_play_pause
              target:
                entity_id: media_player.bedroom_clock_player
            hold_action:
              action: more-info
          - type: tile
            entity: switch.bedroom_clock_screensaver_active
            name: Screensaver
            icon: mdi:sleep
            vertical: true
            tap_action:
              action: perform-action
              perform_action: switch.turn_on
              target:
                entity_id: switch.bedroom_clock_screensaver_active
          visibility:
          - condition: state
            entity: binary_sensor.bedroom_clock_alarm_ringing
            state_not: 'on'
        - type: grid
          columns: 1
          square: false
          visibility:
          - condition: state
            entity: binary_sensor.bedroom_clock_alarm_ringing
            state: 'on'
          cards:
          - type: tile
            entity: button.bedroom_clock_stop_alarm
            name: Stop alarm
            icon: mdi:alarm-off
            color: red
            vertical: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.bedroom_clock_stop_alarm
          - type: tile
            entity: button.bedroom_clock_snooze_alarm
            name: Snooze
            icon: mdi:alarm-snooze
            color: amber
            vertical: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.bedroom_clock_snooze_alarm
