- title: Media
  path: media
  icon: mdi:music
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: Media
      heading_style: title
      icon: mdi:music
      badges:
      - type: button
        icon: mdi:clock-outline
        text: Home
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/home
      - type: button
        icon: mdi:floor-plan
        text: Rooms
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/rooms
      - type: button
        icon: mdi:brightness-6
        text: Screen
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/screen
    - type: media-control
      entity: media_player.bedroom_clock_player
    - type: tile
      entity: media_player.bedroom_clock_player
      features:
      - type: media-player-volume-slider
      features_position: inline
    - type: tile
      entity: button.bedroom_clock_show_music_assistant
      name: Open Music Assistant
      icon: mdi:music-box-multiple
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.bedroom_clock_show_music_assistant
- title: Screen
  path: screen
  icon: mdi:brightness-6
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: Screen
      heading_style: title
      icon: mdi:brightness-6
      badges:
      - type: button
        icon: mdi:clock-outline
        text: Home
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/home
      - type: button
        icon: mdi:floor-plan
        text: Rooms
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/rooms
      - type: button
        icon: mdi:music
        text: Media
        tap_action:
          action: navigate
          navigation_path: /bedroom-clock/media
    - type: tile
      entity: light.bedroom_clock_screen
      name: Screen brightness
      features:
      - type: light-brightness
      features_position: inline
      tap_action:
        action: none
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: switch.bedroom_clock_adaptive_brightness
        name: Auto brightness
        vertical: true
        tap_action:
          action: toggle
      - type: tile
        entity: switch.bedroom_clock_keep_screen_on
        name: Keep screen on
        vertical: true
        tap_action:
          action: toggle
      - type: tile
        entity: switch.bedroom_clock_screensaver_active
        name: Screensaver now
        icon: mdi:sleep
        vertical: true
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.bedroom_clock_screensaver_active
      - type: tile
        entity: button.bedroom_clock_reload_page
        name: Reload page
        icon: mdi:refresh
        vertical: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.bedroom_clock_reload_page
