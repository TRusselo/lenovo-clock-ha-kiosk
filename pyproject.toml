[project]
name = "lck"
version = "0.0.1"
description = "Degoogled Lenovo Smart Clock (gen 1) → Home Assistant kiosk: stock Android Things + Kiosk Satellite."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
