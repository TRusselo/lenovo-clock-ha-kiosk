[project]
name = "lck"
version = "0.1.6"
description = "Degoogled Lenovo Smart Clock (gen 1) → Home Assistant kiosk: stock Android Things + Kiosk Satellite. Guided backup, unlock, flash, setup and restore for Windows, macOS and Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
    "requests>=2.31",
    "zstandard>=0.22",
]

[project.scripts]
lck = "lck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
